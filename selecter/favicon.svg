<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
<!--
  Selecter favicon — simplified 3×3 grid
  360×360 viewBox, cell=120px
  Diagonal: (0,360)→(360,0), x+y=360

  TL grid intersections on diagonal: (120,240) and (240,120)

  5 NW-SE lines (slope+1, y=x+C):
    C= 240: (0,240)→(120,360)          — 1 cell, SW anchor (60,300)
    C= 120: (0,120)→(240,360)          — through (120,240)
    C=   0: (0,0)→(360,360) clipped BR: (180,180)→(360,360)
    C=-120: (120,0)→(360,240)          — through (240,120)
    C=-240: (240,0)→(360,120)          — 1 cell, NE anchor (300,60)

  2 SW-NE parallels (slope-1, x+y=C):
    P1: x+y=480: (120,360)→(360,120)
    P2: x+y=600: (240,360)→(360,240)

  Pin: head(300,60) → tail(60,300), teal
  Grey street: full diagonal (0,360)→(360,0)

  Magenta:
    TL: full square x∈[0,120] y∈[0,120]
    BR: parallelogram (240,120),(180,180),(240,240),(300,180)

  Line weights:
    Streets: 22px  (~2px at 16px render)
    Teal pin: 38px (~3px at 16px render)
    rx: 28px
-->
<defs>
  <clipPath id="tile">
    <rect x="0" y="0" width="360" height="360" rx="28"/>
  </clipPath>
  <clipPath id="tl">
    <polygon points="0,0 360,0 0,360"/>
  </clipPath>
  <clipPath id="br">
    <polygon points="360,0 360,360 0,360"/>
  </clipPath>
</defs>

<rect x="0" y="0" width="360" height="360" rx="28" fill="#0f0f11"/>

<g clip-path="url(#tile)">

  <!-- Magenta blocks -->
  <!-- TL full square: top-left cell -->
  <rect x="0" y="0" width="120" height="120" fill="#c026d3" opacity="0.55"/>
  <!-- BR parallelogram: (240,120),(180,180),(240,240),(300,180) -->
  <polygon points="240,120 180,180 240,240 300,180" fill="#c026d3" opacity="0.55"/>

  <!-- Top-left orthogonal grid, clipped to TL triangle -->
  <g clip-path="url(#tl)" stroke="#3d3d58" stroke-width="22" stroke-linecap="round">
    <line x1="0"   y1="120" x2="360" y2="120"/>
    <line x1="0"   y1="240" x2="360" y2="240"/>
    <line x1="120" y1="0"   x2="120" y2="360"/>
    <line x1="240" y1="0"   x2="240" y2="360"/>
  </g>

  <!-- Bottom-right diagonal grid, clipped to BR triangle -->
  <g clip-path="url(#br)" stroke="#3d3d58" stroke-width="22" stroke-linecap="round">
    <!-- 5 NW-SE lines (slope+1) -->
    <line x1="240" y1="0"   x2="360" y2="120"/>
    <line x1="120" y1="0"   x2="360" y2="240"/>
    <line x1="180" y1="180" x2="360" y2="360"/>
    <line x1="0"   y1="120" x2="240" y2="360"/>
    <line x1="0"   y1="240" x2="120" y2="360"/>
    <!-- 2 SW-NE parallels (slope-1) -->
    <line x1="120" y1="360" x2="360" y2="120"/>
    <line x1="240" y1="360" x2="360" y2="240"/>
  </g>

  <!-- Grey street — full diagonal -->
  <line x1="0" y1="360" x2="360" y2="0"
        stroke="#3d3d58" stroke-width="22" stroke-linecap="round"/>

  <!-- Teal pin line: head(300,60)→tail(60,300) -->
  <line x1="300" y1="60" x2="60" y2="300"
        stroke="#6ee7b7" stroke-width="38" stroke-linecap="butt"/>

  <!-- Arrowhead at (60,300) pointing SW
       back 28px NE: (+19.8,−19.8) → (79.8,280.2)
       perp ±16px: (79.8−11.3,280.2+11.3)=(68.5,291.5) (79.8+11.3,280.2−11.3)=(91.1,268.9) -->
  <polygon points="60,300 69,292 91,269" fill="#6ee7b7"/>

  <!-- Pin head hollow ring at (300,60) -->
  <circle cx="300" cy="60" r="28" fill="#6ee7b7"/>
  <circle cx="300" cy="60" r="14" fill="#0f0f11"/>

</g>
</svg>
