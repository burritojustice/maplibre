<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
<!--
  Selecter favicon — 2×2 grid, light background, thick lines
  320×320 viewBox, cell=160px
  Diagonal: (0,320)→(320,0), x+y=320

  2×2 grid: 1 internal H line at y=160, 1 internal V line at x=160
  Diagonal crosses the grid intersection at (160,160)

  1 NW-SE line in BR (slope+1): through (160,160) → y=x, clipped to BR
    From (160,160) to (320,320)

  2 SW-NE parallels (slope-1):
    P1: x+y=480: (160,320)→(320,160)

  Pin: head near NE, tail near SW
    Head at (260,60) — on diagonal, inside tile
    Tail at (60,260) — on diagonal, inside tile
    Teal line: (260,60)→(60,260)

  Top-left cell teal fill: x∈[0,160] y∈[0,160] (clipped to TL triangle)
-->
<defs>
  <clipPath id="tile">
    <rect x="0" y="0" width="320" height="320" rx="40"/>
  </clipPath>
  <clipPath id="tl">
    <polygon points="0,0 320,0 0,320"/>
  </clipPath>
  <clipPath id="br">
    <polygon points="320,0 320,320 0,320"/>
  </clipPath>
</defs>

<!-- White tile -->
<rect x="0" y="0" width="320" height="320" rx="40" fill="#f8f8f8"/>

<g clip-path="url(#tile)">

  <!-- Magenta fill: top-left cell, clipped to TL triangle -->
  <rect x="0" y="0" width="160" height="160" fill="#c026d3" opacity="0.55" clip-path="url(#tl)"/>

  <!-- TL orthogonal grid — 1 H and 1 V line, clipped to TL triangle -->
  <g clip-path="url(#tl)" stroke="#111" stroke-width="28" stroke-linecap="round">
    <line x1="0"   y1="160" x2="320" y2="160"/>
    <line x1="160" y1="0"   x2="160" y2="320"/>
  </g>

  <!-- BR diagonal grid, clipped to BR triangle -->
  <g clip-path="url(#br)" stroke="#111" stroke-width="28" stroke-linecap="round">
    <!-- 1 NW-SE line through (160,160), clipped to BR -->
    <line x1="160" y1="160" x2="320" y2="320"/>
    <!-- 1 SW-NE parallel (P1: x+y=480) -->
    <line x1="160" y1="320" x2="320" y2="160"/>
  </g>

  <!-- Diagonal street — full, black -->
  <line x1="0" y1="320" x2="320" y2="0"
        stroke="#111" stroke-width="28" stroke-linecap="round"/>

  <!-- Teal pin line: (260,60)→(60,260) -->
  <line x1="260" y1="60" x2="60" y2="260"
        stroke="#6ee7b7" stroke-width="36" stroke-linecap="butt"/>

  <!-- Arrowhead at (60,260) pointing SW
       back 24px NE: (+17,−17) → (77,243)
       perp ±14px: (77−9.9,243+9.9)=(67,253) (77+9.9,243−9.9)=(87,233) -->
  <polygon points="60,260 67,253 87,233" fill="#6ee7b7"/>

  <!-- Pin head at (260,60): larger hollow ring -->
  <circle cx="260" cy="60" r="36" fill="#6ee7b7"/>
  <circle cx="260" cy="60" r="18" fill="#f8f8f8"/>

</g>
</svg>
