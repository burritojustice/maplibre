<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
<!--
  Pin head: large filled circle at (300,60) — pushed NE, stays inside rx=28 corner
  Pin tail: at (60,300) — pushed SW, stays inside rx=28 corner
  Pin head: fully filled teal (no hole), radius 44 — fits inside corner at (300,60)
    Corner circle center at (332,28) radius 28, pin head center (300,60) dist=45 — safe
  Magenta: full #c026d3 no opacity reduction
-->
<defs>
  <clipPath id="tile">
    <rect x="0" y="0" width="360" height="360" rx="28"/>
  </clipPath>
  <clipPath id="tl">
    <polygon points="0,0 360,0 0,360"/>
  </clipPath>
  <clipPath id="br">
    <polygon points="360,0 360,360 0,360"/>
  </clipPath>
</defs>

<rect x="0" y="0" width="360" height="360" rx="28" fill="#0f0f11"/>

<g clip-path="url(#tile)">

  <!-- Magenta: top-left cell, full brightness -->
  <rect x="0" y="0" width="120" height="120" fill="#e621f5" clip-path="url(#tl)"/>
  <!-- Magenta: BR parallelogram -->
  <polygon points="240,120 180,180 240,240 300,180" fill="#e621f5"/>

  <!-- TL orthogonal grid -->
  <g clip-path="url(#tl)" stroke="#f0f0f0" stroke-width="22" stroke-linecap="round">
    <line x1="0"   y1="120" x2="360" y2="120"/>
    <line x1="0"   y1="240" x2="360" y2="240"/>
    <line x1="120" y1="0"   x2="120" y2="360"/>
    <line x1="240" y1="0"   x2="240" y2="360"/>
  </g>

  <!-- BR diagonal grid -->
  <g clip-path="url(#br)" stroke="#f0f0f0" stroke-width="22" stroke-linecap="round">
    <line x1="240" y1="0"   x2="360" y2="120"/>
    <line x1="120" y1="0"   x2="360" y2="240"/>
    <line x1="180" y1="180" x2="360" y2="360"/>
    <line x1="0"   y1="120" x2="240" y2="360"/>
    <line x1="0"   y1="240" x2="120" y2="360"/>
    <line x1="120" y1="360" x2="360" y2="120"/>
    <line x1="240" y1="360" x2="360" y2="240"/>
  </g>

  <!-- Full diagonal street -->
  <line x1="0" y1="360" x2="360" y2="0"
        stroke="#f0f0f0" stroke-width="22" stroke-linecap="round"/>

  <!-- Teal pin line: head(310,50)→tail(50,310) -->
  <line x1="310" y1="50" x2="50" y2="310"
        stroke="#6ee7b7" stroke-width="38" stroke-linecap="butt"/>

  <!-- Arrowhead at tail (50,310) pointing SW -->
  <polygon points="50,310 61,299 83,276" fill="#6ee7b7"/>

  <!-- Pin head: large filled teal circle, no hole, at (310,50) -->
  <circle cx="310" cy="50" r="44" fill="#6ee7b7"/>

</g>
</svg>
